[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flame-sheep-audio"
version = "0.1.0"
description = "Real-time audio analysis engine — beat detection, energy tracking, tempo estimation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.16",
    "sounddevice>=0.5.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
