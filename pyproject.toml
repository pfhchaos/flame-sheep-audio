[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "flame-sheep-audio"
version = "0.1.0"
description = "Real-time audio analysis engine — beat detection, energy tracking, tempo estimation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.16",
    "sounddevice>=0.5.1",
    "dbus-python",
    "PyGObject",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# BeatNet (pip) is only imported for the particle-filter beat-tracking path
# (use_particle_filter=True); the default BeatNetLite detector is pure-numpy and
# in-package. BeatNet drags torch/madmom/librosa, so it's opt-in.
beatnet = ["BeatNet"]
# sd_notify watchdog integration (processor.py); degrades to a no-op without it.
watchdog = ["systemd-python"]

[tool.scikit-build]
# Pin build behaviour to the installed scikit-build-core (reproducible builds).
minimum-version = "build-system.requires"
# CMakeLists.txt lives next to this pyproject.toml.
cmake.source-dir = "."
cmake.version = ">=3.15"
# Pure-Python package is src-layout; CMake installs the `_prtcqt` extension
# into the package dir so it imports as `flame_sheep_audio._prtcqt`.
wheel.packages = ["src/flame_sheep_audio"]
# Don't ship the C/C++ build inputs (the vendored rt-cqt sources) in the
# wheel — _prtcqt is compiled from them, not loaded from them at runtime.
# The _btrack / _native entries guard against stale, untracked prebuilt
# binaries in a dev working tree leaking into a local build: _btrack is
# externalized to the overlay btrack-beat-tracker package, and _native is a
# dead leftover from an old monolithic extension (nothing imports it). A
# clean checkout has neither; only CMake's _prtcqt ships.
wheel.exclude = [
    "flame_sheep_audio/native/**",
    "flame_sheep_audio/_btrack*.so",
    "flame_sheep_audio/_native*.so",
]
